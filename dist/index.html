<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>框一下｜教學截圖工具</title><meta name="description" content="上傳截圖，加上紅框、箭頭、步驟編號與說明，一鍵下載教學圖片。圖片僅在瀏覽器內處理。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f43f5e'/%3E%3Crect x='7' y='8' width='18' height='16' rx='2' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<header><a class="brand" href="./"><span class="brand-mark">▣</span><span>框一下<small>教學截圖工具</small></span></a><div class="header-actions"><button id="upload">＋ 開啟圖片</button><button class="primary" id="export" disabled>下載 PNG</button></div></header>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="projectFile" accept=".json,application/json" hidden><main>
<aside>
<section><h2>標註工具</h2><div class="tools" role="group" aria-label="選擇標註工具">
<button data-tool="select" class="active" aria-pressed="true"><b>↖</b>選取<span>V</span></button>
<button data-tool="rect" aria-pressed="false"><b>▭</b>紅框<span>R</span></button>
<button data-tool="arrow" aria-pressed="false"><b>↗</b>箭頭<span>A</span></button>
<button data-tool="number" aria-pressed="false"><b>①</b>編號<span>N</span></button>
<button data-tool="text" aria-pressed="false"><b>T</b>文字<span>T</span></button>
<button data-tool="mosaic" aria-pressed="false"><b>▦</b>馬賽克<span>M</span></button>
</div></section>
<section class="settings"><h2 id="settingsTitle">標註樣式</h2><label class="field-label">顏色 <input id="color" type="color" value="#f43f5e" aria-label="標註顏色"></label><div class="swatches" aria-label="常用顏色"><button style="--sw:#f43f5e" data-color="#f43f5e" aria-label="紅色"></button><button style="--sw:#2563eb" data-color="#2563eb" aria-label="藍色"></button><button style="--sw:#16a34a" data-color="#16a34a" aria-label="綠色"></button><button style="--sw:#f59e0b" data-color="#f59e0b" aria-label="橘色"></button><button style="--sw:#172033" data-color="#172033" aria-label="深灰色"></button><button style="--sw:#ffffff" data-color="#ffffff" aria-label="白色"></button></div>
<label class="field-label" for="width">線條粗細 <output id="widthValue">6 px</output></label><input id="width" type="range" min="2" max="24" value="6">
<label class="field-label" for="size">文字／編號大小 <output id="sizeValue">40 px</output></label><input id="size" type="range" min="16" max="160" value="40">
<div id="textField"><label class="field-label" for="textInput">說明文字</label><textarea id="textInput" rows="3" placeholder="例如：點選申請，再上傳附件">點選這裡</textarea><small>選擇文字工具後，點一下圖片放置。</small></div>
<label class="field-label" for="nextNumber">下一個編號 <input id="nextNumber" type="number" min="1" max="999" value="1"></label>
<button id="delete" class="delete" disabled>刪除選取的標註</button></section>
<section class="project-settings"><h2>圖片外圍留白</h2><small>在空白區加上說明，避免遮住截圖。單位：px。</small><div class="margin-grid"><label>上<input id="marginTop" type="number" min="0" max="2000" value="0"></label><label>下<input id="marginBottom" type="number" min="0" max="2000" value="0"></label><label>左<input id="marginLeft" type="number" min="0" max="2000" value="0"></label><label>右<input id="marginRight" type="number" min="0" max="2000" value="0"></label></div><button id="applyMargins" disabled>套用留白</button></section>
<section class="project-settings"><h2>可編輯專案</h2><div class="project-actions"><button id="saveProject" disabled>儲存專案</button><button id="openProject">開啟專案</button></div><small>下載 JSON 檔，保留原圖、留白與標註，下次可繼續編輯。專案包含未遮蔽的原圖，分享教學請使用 PNG。</small></section><div class="privacy"><span>◈</span><p>圖片留在你的瀏覽器<br><small>不會上傳至伺服器</small></p></div>
</aside>
<div class="workspace">
<div class="workspace-bar"><div class="file-info"><strong id="filename">尚未開啟圖片</strong><span id="dimensions">PNG、JPG、WebP、GIF</span></div><div class="view-actions"><button id="undo" title="復原 Ctrl+Z" aria-label="復原" disabled>↶</button><button id="redo" title="重做 Ctrl+Shift+Z" aria-label="重做" disabled>↷</button><span class="divider"></span><button id="zoomOut" aria-label="縮小" disabled>−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大" disabled>＋</button><button id="fit" disabled>適合畫面</button></div></div>
<div id="board" class="board"><div id="empty"><div class="empty-symbol"><span>▧</span><i>＋</i></div><h1>把操作步驟，框清楚。</h1><p>拖曳截圖到這裡，或直接貼上圖片</p><button id="emptyUpload" class="primary">選擇一張截圖</button><button id="demo" class="text-button">先用範例試試看</button><div class="flow"><span>01 開啟截圖</span><span>02 加上標註</span><span>03 下載圖片</span></div></div><div id="canvasWrap" hidden><canvas id="canvas" tabindex="0" aria-label="截圖標註畫布。選擇工具後，以滑鼠或觸控新增標註。"></canvas></div><div id="dropOverlay" hidden>放開圖片，開始標註</div></div>
<footer><span id="hint">小技巧：使用 Ctrl / ⌘ + V 貼上剪貼簿截圖</span><span id="count">0 個標註</span></footer>
</div>
</main><div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
